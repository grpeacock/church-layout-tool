<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cruciform Church Seating Planner</title>
<style>
  :root{
    --bg:#f5f3ee; --panel:#ffffff; --line:#d8d2c4; --ink:#222; --muted:#6b6557;
    --accent:#7a1f1f; --tan:#d2b48c; --tanstroke:#a07d4f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.4 system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
  header{flex:0 0 auto;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:12px}
  .tabsbar{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .tab{padding:6px 12px;border:1px solid var(--line);border-radius:7px 7px 0 0;background:#efeae0;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px}
  .tab.active{background:var(--panel);border-bottom-color:var(--panel);font-weight:650}
  .tab .x{color:var(--muted);font-weight:700;border:0;background:none;cursor:pointer;padding:0 2px;line-height:1}
  .tab .x:hover{color:var(--accent)}
  .btn{padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-size:13px}
  .btn:hover{background:#f0ece3}
  .btn.sm{padding:3px 9px;font-size:12px}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08)}
  .toolbar{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:425px 1fr;grid-template-rows:minmax(0,1fr);gap:0}
  .controls{min-height:0;padding:14px 16px 28px;overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
  .stage{min-height:0;padding:0;overflow:hidden;display:flex;flex-direction:column;position:relative}
  .stage .row-actions{flex:0 0 auto;margin:0;padding:12px 16px 6px}
  .stage .legend{flex:0 0 auto;margin:0;padding:0 16px 6px}
  .canvas-wrap{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 16px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;position:relative}
  .canvas-wrap.dragging{cursor:grabbing}
  .canvas-wrap canvas{touch-action:none}
  fieldset{border:1px solid var(--line);border-radius:9px;margin:0 0 12px;padding:10px 12px}
  legend{font-weight:650;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:0 6px}
  .subhead{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin:11px 0 5px;border-bottom:1px dotted var(--line);padding-bottom:3px}
  .subhead:first-child{margin-top:2px}
  .field{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;margin:7px 0}
  .field label{font-size:13px}
  .field input[type=number],.field input[type=text],.field select{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:6px;font:inherit}
  .field.range{grid-template-columns:1fr 64px}
  .field.range input[type=range]{width:100%}
  .field.full{grid-template-columns:1fr}
  /* custom layout editor */
  .custombox{margin-top:4px}
  .dndlist{display:flex;flex-direction:column;gap:4px}
  .dnditem{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fafafa}
  .dnditem.is-section{background:#f3e9d8;border-color:var(--tanstroke)}
  .dnditem.is-aisle{background:#eef0f2}
  .dnditem.dragging{opacity:.45}
  .dnditem.over{outline:2px dashed var(--accent);outline-offset:1px}
  .dnditem .grip{cursor:grab;color:#999;user-select:none;font-size:13px}
  .dnditem .tag{font-size:12px;font-weight:600;min-width:52px}
  .dnditem input{width:100%;padding:3px 5px;border:1px solid var(--line);border-radius:5px;font:inherit}
  .dnditem .unit{font-size:11px;color:var(--muted)}
  .dnditem .del{border:0;background:none;color:#b00;font-weight:700;cursor:pointer;font-size:15px;line-height:1}
  .addbtns{display:flex;gap:6px;margin:7px 0 2px}
  .cust-total{font-size:12px;color:var(--muted);margin-top:6px}
  .cust-total .badge{padding:1px 7px;border-radius:9px;font-size:11px;margin-left:4px;white-space:nowrap}
  .cust-total .badge.ok{background:#d8f0d8;color:#1a6b1a}
  .cust-total .badge.over{background:#f6dcdc;color:#9b1c1c}
  .cust-total .badge.under{background:#fdeccb;color:#8a5a00}
  .cust-hint{font-size:11px;color:var(--muted);margin:3px 0 0;font-style:italic}
  canvas{background:#fff;border:1px solid var(--line);border-radius:10px;max-width:100%;max-height:100%;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .stats{flex:0 0 auto;max-height:38%;overflow:auto;border-top:2px solid var(--line);background:var(--panel);padding:10px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel)}
  .stat .v{font-size:21px;font-weight:700}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat.big .v{color:var(--accent)}
  table.cmp{border-collapse:collapse;margin-top:16px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 9px;text-align:right;font-size:13px}
  table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--muted)}
  table.cmp thead th{background:#efeae0}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 2px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25)}
  .hint{font-size:12px;color:var(--muted);margin:2px 0 10px}
  .row-actions{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  /* summary view */
  .tab.summary-tab{font-weight:650}
  main.summary{grid-template-columns:1fr}
  main.summary #controls, main.summary #stage{display:none}
  main:not(.summary) #summaryView{display:none}
  .summary{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .summary-images{flex:1 1 auto;min-height:0;overflow:auto;padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-content:flex-start}
  .sumcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:box-shadow .12s,transform .12s}
  .sumcard:hover{box-shadow:0 4px 14px rgba(0,0,0,.16);transform:translateY(-2px);border-color:var(--accent)}
  .sumcard canvas{display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
  .sumcap{font-size:12px;color:var(--accent);font-weight:600;text-align:center;margin-top:6px}
  .summary-table{flex:0 0 auto;max-height:42%;overflow:auto;border-top:2px solid var(--line);background:var(--panel);padding:8px 16px 14px}
  .summary-table table.cmp{margin-top:0}

  /* sidebar collapse */
  main.collapsed{grid-template-columns:1fr}
  main.collapsed #controls{display:none}

  /* floating sidebar toggle button on the stage */
  .sidebar-toggle{
    position:absolute; top:8px; left:8px; z-index:5;
    width:34px; height:34px; padding:0;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; line-height:1; background:var(--panel);
    border:1px solid var(--line); border-radius:7px; cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .sidebar-toggle:hover{background:#f0ece3}
  /* leave room for the toggle button at left of the action row */
  .stage .row-actions{padding-left:52px}

  /* floating zoom controls in the stage */
  .canvas-controls{
    position:absolute; right:18px; bottom:14px; z-index:5;
    display:flex; flex-direction:column;
    background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 1px 4px rgba(0,0,0,.10); overflow:hidden;
  }
  .canvas-controls button{
    width:34px; height:34px; padding:0; font-size:16px; line-height:1;
    background:transparent; border:0; cursor:pointer;
  }
  .canvas-controls button:hover{background:#f0ece3}
  .canvas-controls button + button{border-top:1px solid var(--line)}

  /* drawer backdrop (mobile only) */
  .backdrop{display:none}

  /* ===== mobile-friendly tweaks ===== */
  @media (max-width: 800px) {
    header{padding:8px 12px;gap:8px}
    header h1{font-size:14px}
    header .sub{display:none}
    .tabsbar{padding:6px 8px;gap:4px;flex-wrap:nowrap;overflow-x:auto}
    .tab{flex:0 0 auto;font-size:12px;padding:5px 9px}
    .toolbar{margin-left:auto;flex-wrap:nowrap}
    .toolbar .btn{padding:4px 8px;font-size:12px}

    /* sidebar becomes an overlay drawer */
    main{grid-template-columns:1fr}
    main.collapsed{grid-template-columns:1fr}
    #controls{
      position:fixed; top:0; left:0; bottom:0;
      width:min(85vw, 360px);
      z-index:30; transform:translateX(-100%);
      transition:transform .22s ease;
      border-right:1px solid var(--line);
      box-shadow:2px 0 14px rgba(0,0,0,.25);
    }
    main:not(.collapsed) #controls{display:block;transform:translateX(0)}
    main.collapsed #controls{display:block;transform:translateX(-100%)}

    .backdrop{
      display:block; position:fixed; inset:0; background:rgba(0,0,0,.38);
      z-index:25; opacity:0; pointer-events:none; transition:opacity .18s;
    }
    main:not(.collapsed) .backdrop{opacity:1; pointer-events:auto}

    /* stage layout: stack action row, fix legend wrap */
    .stage .row-actions{padding:8px 12px 4px 52px; gap:4px}
    .stage .row-actions .btn{padding:5px 9px; font-size:12px}
    .stage .legend{padding:0 12px 4px; font-size:11px; gap:10px}
    .canvas-wrap{padding:4px 8px}
    .stats{padding:8px 12px;max-height:36vh;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
    .stat{padding:7px 9px}
    .stat .v{font-size:18px}
    .stat .k{font-size:11px}

    /* summary: each region scrolls on its own; thumbnails shrink */
    .summary-images{padding:10px;gap:10px}
    .sumcard canvas{max-width:calc(100vw - 44px); height:auto}
    .summary-table{max-height:50vh;padding:6px 12px 10px}
    table.cmp th,table.cmp td{padding:4px 6px;font-size:12px}

    /* zoom controls smaller on mobile */
    .canvas-controls{right:10px; bottom:10px}
    .canvas-controls button{width:38px; height:38px} /* easier touch targets */
    .sidebar-toggle{width:40px; height:40px; font-size:20px} /* easier touch */
  }
</style>
</head>
<body>
<header>
  <h1>⛪ Cruciform Church Seating Planner</h1>
  <span class="sub">Live layout &amp; seat-count tool · dimensions in feet</span>
</header>

<div class="tabsbar" id="tabsbar"></div>

<main id="main">
  <section class="controls" id="controls"></section>
  <div class="backdrop" id="backdrop"></div>
  <section class="stage" id="stage">
    <button class="sidebar-toggle" id="sidebarToggle" title="Toggle settings panel" aria-label="Toggle settings panel">☰</button>
    <div class="row-actions">
      <button class="btn primary" id="exportBtn">⬇ Export PNG</button>
      <button class="btn" id="linkBtn">🔗 Copy share link</button>
      <button class="btn" id="strBtn">📋 Copy config string</button>
      <button class="btn" id="loadBtn">📥 Load from string</button>
    </div>
    <div class="legend">
      <span><i class="sw" style="background:#fff;border-color:#000"></i> Walls (black)</span>
      <span><i class="sw" style="background:var(--tan);border-color:var(--tanstroke)"></i> Seat rows</span>
      <span><i class="sw" style="background:var(--accent);border-color:var(--accent)"></i> Altar</span>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="cv"></canvas>
      <div class="canvas-controls" id="canvasControls">
        <button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="zoomReset" title="Reset view" aria-label="Reset view">↺</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </section>
  <section class="summary" id="summaryView">
    <div class="summary-images" id="summaryImages"></div>
    <div class="summary-table">
      <table class="cmp" id="cmp"></table>
    </div>
  </section>
</main>

<script>
"use strict";

/* ====================== configuration model ====================== */
function defaultSeating(sections){
  return { mode:"equal", sections:sections, seatsPerSection:9, edgeAisle:2, centerAisle:6, nonCenterAisle:4, custom:null };
}
function defaultConfig(name){
  return {
    name: name || "Option A",
    // input mode: "dimensions" (enter feet, seats derived) | "seats" (enter seats, feet derived)
    inputMode: "dimensions",
    // dimensions (feet)
    naveLength: 80, naveWidth: 40,
    transeptLength: 24, transeptWidth: 30, transeptDir: "toward", transeptFrontGap: 0,
    // seats-first row counts (used when inputMode === "seats")
    naveRows: 28, transeptRows: 8,
    // per-seat
    seatWidth: 1.6, seatDepth: 1.5, legSpace: 1.5,
    // altar
    altarDistance: 0, altarWidth: 9, altarDepth: 4, frontToAltar: 8,
    // seating / aisles (per area)
    naveSeating: defaultSeating(2),
    transeptSeating: defaultSeating(1),
  };
}

// metadata for the simple numeric top-level fields
const NUM = {
  naveLength:{l:"Nave length", min:0, step:1},
  naveWidth:{l:"Nave width", min:0, step:1, affectsTarget:true},
  transeptLength:{l:"Transept length (per arm)", min:0, step:1, affectsTarget:true},
  transeptWidth:{l:"Transept width (depth)", min:0, step:1, affectsTarget:true},
  transeptFrontGap:{l:"Transept front-row setback from E wall (Forward)", min:0, step:0.5},
  seatWidth:{l:"Seat width", min:0.1, step:0.1},
  seatDepth:{l:"Seat depth", min:0.1, step:0.1},
  legSpace:{l:"Leg space (front)", min:0, step:0.1},
  altarDistance:{l:"Altar dist. from crossing center", min:0, max:60, step:0.5, range:true},
  altarWidth:{l:"Altar width", min:0, step:0.5},
  altarDepth:{l:"Altar depth", min:0, step:0.5},
  frontToAltar:{l:"Front nave row → altar", min:0, step:0.5},
};
const SIMPLE_NUM_KEYS = Object.keys(NUM);

/* ====================== state ====================== */
const state = { tabs: [], viewports: [], active: 0, view: "edit", sidebar: "open" };  // view: "edit" | "summary"; sidebar: "open" | "collapsed"
function defaultViewport(){ return { zoom:1, panX:0, panY:0 }; }
function activeVP(){ return state.viewports[state.active] || (state.viewports[state.active] = defaultViewport()); }
let dragState = null;  // { key, from } during a drag-reorder

/* ====================== geometry helpers ====================== */
// Divide a span L into n equal seat-sections separated by aisles (Equal mode).
// edgeStart/edgeEnd are the wall-side gaps; edgeEnd defaults to edgeStart.
function layoutSections(L, n, centerA, nonCenterA, edgeStart, edgeEnd){
  n = Math.max(1, Math.round(n));
  if (edgeEnd == null) edgeEnd = edgeStart;
  let inter = 0;
  if (n > 1){
    if (n % 2 === 0) inter = centerA + nonCenterA * (n - 2);
    else inter = nonCenterA * (n - 1);
  }
  const usable = L - edgeStart - edgeEnd - inter;
  const size = usable > 0 ? usable / n : 0;
  const segs = [];
  let pos = edgeStart;
  for (let i=0;i<n;i++){
    segs.push({start:pos, size:size});
    pos += size;
    if (i < n-1){
      const isCenterGap = (n % 2 === 0) && (i === n/2 - 1);
      pos += isCenterGap ? centerA : nonCenterA;
    }
  }
  return {segs, size, inter};
}
// Equal-mode section segments for a seating config over available length L.
function sectionsEqual(s, L, edgeStart, edgeEnd){
  return layoutSections(L, Math.max(1,Math.round(s.sections)), +s.centerAisle, +s.nonCenterAisle, +edgeStart, +edgeEnd).segs;
}
// Custom-mode section segments (aisles are implicit gaps), anchored at 0.
function sectionsCustom(list){
  const segs = []; let pos = 0;
  for (const it of (list||[])){
    const w = Math.max(0, +it.width || 0);
    if (it.type === "section") segs.push({start:pos, size:w});
    pos += w;
  }
  return {segs, total:pos};
}

function makeBar(ax0, ay0, axx, axy, dxx, dxy, seats){
  return {
    a:{x:ax0, y:ay0}, b:{x:ax0+axx, y:ay0+axy},
    c:{x:ax0+axx+dxx, y:ay0+axy+dxy}, d:{x:ax0+dxx, y:ay0+dxy}, seats
  };
}
// Build a single angled transept arm. Rather than laying out a rectangular grid
// and rotating it (which spills seats past the walls), we rotate the arm rectangle
// into the seat frame first, measure the available space, then fill it with rows.
// `angle` points from the pivot toward the altar; +u is the depth/facing axis,
// +v runs along each row. Seats whose full footprint falls inside the arm are kept,
// so rows naturally shorten into partial rows at the slanted corners.
function buildAngledArm(pivot, angle, armRect, TS, sW, sD, pitch){
  if (armRect.xMax <= armRect.xMin || armRect.yMax <= armRect.yMin)
    return { bars:[], totalSeats:0, rows:0, maxSeatsPerRow:0, secCount:0 };
  const ex = {x: Math.cos(angle), y: Math.sin(angle)};    // depth axis (toward altar)
  const ey = {x: -Math.sin(angle), y: Math.cos(angle)};   // along-row axis
  const world = (u, v) => ({
    x: pivot.x + u*ex.x + v*ey.x,
    y: pivot.y + u*ex.y + v*ey.y,
  });
  // Project the arm rectangle's corners into (u,v) to find the usable extent.
  const corners = [
    {x:armRect.xMin, y:armRect.yMin}, {x:armRect.xMax, y:armRect.yMin},
    {x:armRect.xMax, y:armRect.yMax}, {x:armRect.xMin, y:armRect.yMax},
  ];
  let uMin=Infinity, uMax=-Infinity, vMin=Infinity, vMax=-Infinity;
  for (const c of corners){
    const dx = c.x - pivot.x, dy = c.y - pivot.y;
    const u = dx*ex.x + dy*ex.y;   // (c-pivot)·ex
    const v = dx*ey.x + dy*ey.y;   // (c-pivot)·ey
    if (u<uMin) uMin=u; if (u>uMax) uMax=u;
    if (v<vMin) vMin=v; if (v>vMax) vMax=v;
  }
  const Lv = vMax - vMin;
  // Section pattern along the row, fitted to the available along-row length.
  // Edge aisles are already carved off the rectangle (axis-aligned, parallel to
  // the walls), so the section layout keeps only its interior/center aisles here.
  let vSegs;
  if (TS.mode==="custom" && Array.isArray(TS.custom)){
    const {segs, total} = sectionsCustom(TS.custom);
    const k = total > 0 ? Lv/total : 1;
    vSegs = segs.map(s=>({start: vMin + s.start*k, size: s.size*k}));
  } else {
    vSegs = sectionsEqual(TS, Lv, 0, 0).map(s=>({start: vMin + s.start, size: s.size}));
  }

  const inside = p =>
    p.x >= armRect.xMin - 1e-6 && p.x <= armRect.xMax + 1e-6 &&
    p.y >= armRect.yMin - 1e-6 && p.y <= armRect.yMax + 1e-6;
  // Keep a seat when its center is inside the fill area — i.e. at least half the
  // seat footprint sits inside (a seat straddles a single wall in practice, so
  // center-inside is the ≥50%-inside threshold). Such seats may poke up to half
  // their size past a boundary rather than being dropped entirely.
  const seatInside = (uLo, uHi, vLo, vHi) =>
    inside(world((uLo+uHi)/2, (vLo+vHi)/2));

  const bars = [];
  let totalSeats=0, rows=0, maxSeatsPerRow=0;
  // Rows stack from the altar-facing edge (uMax) away toward the far wall (uMin).
  for (let k=0; k<1000; k++){
    const uHi = uMax - k*pitch;   // front edge of the row (toward altar)
    const uLo = uHi - sD;         // back edge
    if (uHi <= uMin + 1e-9) break;
    let rowSeats = 0;
    for (const seg of vSegs){
      const segSeatCount = Math.floor(seg.size / sW + 1e-9);
      if (segSeatCount <= 0) continue;
      let runStart = -1, runCount = 0;
      const flush = () => {
        if (runCount > 0){
          const vLo = seg.start + runStart*sW;
          const vHi = vLo + runCount*sW;
          bars.push({
            a: world(uLo, vLo), b: world(uLo, vHi),
            c: world(uHi, vHi), d: world(uHi, vLo),
            seats: runCount,
          });
          rowSeats += runCount;
        }
        runStart = -1; runCount = 0;
      };
      for (let s=0; s<segSeatCount; s++){
        const vLo = seg.start + s*sW, vHi = vLo + sW;
        if (seatInside(uLo, uHi, vLo, vHi)){
          if (runStart < 0) runStart = s;
          runCount++;
        } else {
          flush();
        }
      }
      flush();
    }
    if (rowSeats > 0){
      rows++;
      totalSeats += rowSeats;
      if (rowSeats > maxSeatsPerRow) maxSeatsPerRow = rowSeats;
    }
  }
  return { bars, totalSeats, rows, maxSeatsPerRow, secCount: vSegs.length };
}

/* ====================== seats-first resolver ======================
   In "seats" input mode the user enters row counts and per-section seat
   counts; we convert those into the exact feet dimensions that make
   buildModel reproduce them, then hand a plain "dimensions" config to the
   unchanged model. This keeps both input sets independent and lossless. */
function interAisleTotal(n, centerA, nonCenterA){
  n = Math.max(1, Math.round(n));
  if (n <= 1) return 0;
  return (n % 2 === 0) ? centerA + nonCenterA*(n-2) : nonCenterA*(n-1);
}
// Along-row span (feet) a seating config occupies. edgeStart/edgeEnd are the
// wall-side aisles to add (Equal mode); Custom lists carry their own aisles.
function computeAlongRowFeet(seat, sW, edgeStart, edgeEnd){
  if (seat.mode === "custom" && Array.isArray(seat.custom)){
    return seat.custom.reduce((a,it)=>{
      const w = Math.max(0, +it.width || 0);
      return a + (it.type === "section" ? w*sW : w);   // section widths are in seats
    }, 0);
  }
  const n = Math.max(1, Math.round(seat.sections));
  const sps = Math.max(0, Math.round(seat.seatsPerSection));
  return (+edgeStart) + (+edgeEnd) + n*sps*sW + interAisleTotal(n, +seat.centerAisle, +seat.nonCenterAisle);
}
// Copy a seating config with Custom section widths converted seats -> feet
// (aisles stay feet) so the model's feet-based layout code works unchanged.
function resolveSeatingToFeet(seat, sW){
  if (seat.mode === "custom" && Array.isArray(seat.custom)){
    return Object.assign({}, seat, {
      custom: seat.custom.map(it => it.type === "section"
        ? { type:"section", width: Math.max(0, +it.width||0) * sW }
        : { type:"aisle",   width: Math.max(0, +it.width||0) })
    });
  }
  return seat;
}
// Return a plain dimensions-mode config. Pass-through when already in
// dimensions mode; otherwise derive every feet dimension from seat counts.
function resolveConfig(cfg){
  if (cfg.inputMode !== "seats") return cfg;
  const sW=+cfg.seatWidth, sD=+cfg.seatDepth, leg=+cfg.legSpace, pitch=sD+leg;
  const NS=cfg.naveSeating, TS=cfg.transeptSeating, dir=cfg.transeptDir;
  const r = Object.assign({}, cfg);
  r.inputMode = "dimensions";
  r.naveSeating = resolveSeatingToFeet(NS, sW);
  r.transeptSeating = resolveSeatingToFeet(TS, sW);

  // transept: which axis holds rows vs. seats depends on the seat direction
  if (dir === "angled"){                       // not cleanly invertible: keep feet
    r.transeptLength = +cfg.transeptLength; r.transeptWidth = +cfg.transeptWidth;
  } else if (dir === "forward"){               // rows stack across the width (depth)
    const gap = Math.max(0, +cfg.transeptFrontGap || 0);
    r.transeptWidth  = Math.max(0, Math.round(+cfg.transeptRows))*pitch + gap;
    r.transeptLength = computeAlongRowFeet(TS, sW, +TS.edgeAisle, 0);   // one outer edge aisle
  } else {                                     // "toward": rows stack along the arm length
    r.transeptLength = Math.max(0, Math.round(+cfg.transeptRows))*pitch;
    r.transeptWidth  = computeAlongRowFeet(TS, sW, +TS.edgeAisle, +TS.edgeAisle);
  }

  // nave: seats run across the width, rows stack down the length
  r.naveWidth = computeAlongRowFeet(NS, sW, +NS.edgeAisle, +NS.edgeAisle);
  const halfTW = r.transeptWidth/2;
  const frontRowTopY = (-(+cfg.altarDistance)) + (+cfg.altarDepth)/2 + (+cfg.frontToAltar || 0);
  r.naveLength = Math.max(0, Math.max(0, Math.round(+cfg.naveRows))*pitch + frontRowTopY - halfTW);
  return r;
}

/* ====================== core model ====================== */
function buildModel(cfg){
  cfg = resolveConfig(cfg);
  const nw=+cfg.naveWidth, nl=+cfg.naveLength;
  const tw=+cfg.transeptWidth, tl=+cfg.transeptLength;
  const sW=+cfg.seatWidth, sD=+cfg.seatDepth, leg=+cfg.legSpace;
  const pitch = sD + leg;
  const dir = cfg.transeptDir;
  const NS = cfg.naveSeating, TS = cfg.transeptSeating;

  const cx=0, cy=0;
  const halfNW=nw/2, halfTW=tw/2;

  const d=+cfg.altarDistance;
  const altar={cx:cx, cy:cy-d, w:+cfg.altarWidth, h:+cfg.altarDepth};
  const altarFrontY = altar.cy + altar.h/2;
  const altarTopY   = altar.cy - altar.h/2;
  const behind = Math.max(+cfg.altarDepth, 6);
  const chancelTopY = Math.min(cy - halfTW, altarTopY - behind);

  const xL = cx - halfNW - tl, xR = cx + halfNW + tl;
  const naveBottom = cy + halfTW + nl;
  const bounds = {minX:xL, maxX:xR, minY:chancelTopY, maxY:naveBottom};

  const outline = [
    {x:cx-halfNW, y:chancelTopY}, {x:cx+halfNW, y:chancelTopY},
    {x:cx+halfNW, y:cy-halfTW},   {x:xR,        y:cy-halfTW},
    {x:xR,        y:cy+halfTW},   {x:cx+halfNW, y:cy+halfTW},
    {x:cx+halfNW, y:naveBottom},  {x:cx-halfNW, y:naveBottom},
    {x:cx-halfNW, y:cy+halfTW},   {x:xL,        y:cy+halfTW},
    {x:xL,        y:cy-halfTW},   {x:cx-halfNW, y:cy-halfTW},
  ];

  const bars = [];
  const segSeats = (size)=> Math.floor(size/sW + 1e-9);
  const sumSeats = (segs)=> segs.reduce((a,s)=> a + Math.max(0, segSeats(s.size)), 0);

  /* ----- NAVE (faces altar): seat-axis +x, depth +y ----- */
  const naveLeft = cx - halfNW;
  // front row placed purely by distance from altar (may sit inside the crossing).
  const frontRowTopY = altarFrontY + (+cfg.frontToAltar || 0);
  const naveRows = Math.max(0, Math.floor((naveBottom - frontRowTopY) / pitch + 1e-9));
  const naveSegs = (NS.mode==="custom" && Array.isArray(NS.custom))
    ? sectionsCustom(NS.custom).segs
    : sectionsEqual(NS, nw, NS.edgeAisle, NS.edgeAisle);
  for (let r=0;r<naveRows;r++){
    const y0 = frontRowTopY + r*pitch;
    for (const seg of naveSegs){
      const seats = segSeats(seg.size); if (seats<=0) continue;
      bars.push(makeBar(naveLeft+seg.start, y0, seg.size,0, 0,sD, seats));
    }
  }
  const naveSeatsPerRow = sumSeats(naveSegs);
  const naveSecCount = naveSegs.length;
  const naveTotal = naveSeatsPerRow * naveRows;

  /* ----- TRANSEPTS ----- */
  let tRows=0, tSeatsPerRow=0, tSecCount=0;
  let armTotalL=0, armTotalR=0;
  if (dir === "forward"){
    // faces altar end; gap pulls front row off the liturgical-east (top) wall.
    const gap = Math.max(0, +cfg.transeptFrontGap || 0);
    tRows = Math.max(0, Math.floor((tw - gap) / pitch + 1e-9));
    let leftSegs, rightSegs;
    if (TS.mode==="custom" && Array.isArray(TS.custom)){
      const segs = sectionsCustom(TS.custom).segs;            // anchored from each outer wall, mirrored
      leftSegs  = segs.map(s=>({size:s.size, world:xL + s.start}));
      rightSegs = segs.map(s=>({size:s.size, world:xR - s.start - s.size}));
    } else {
      // Equal: no edge aisle on the crossing side (nave already provides clearance).
      leftSegs  = sectionsEqual(TS, tl, TS.edgeAisle, 0).map(s=>({size:s.size, world:xL + s.start}));
      rightSegs = sectionsEqual(TS, tl, 0, TS.edgeAisle).map(s=>({size:s.size, world:(cx+halfNW) + s.start}));
    }
    for (const segs of [leftSegs, rightSegs]){
      for (let r=0;r<tRows;r++){
        const y0 = (cy-halfTW) + gap + r*pitch;
        for (const seg of segs){
          const seats = segSeats(seg.size); if (seats<=0) continue;
          bars.push(makeBar(seg.world, y0, seg.size,0, 0,sD, seats));
        }
      }
    }
    tSeatsPerRow = sumSeats(leftSegs);
    tSecCount = leftSegs.length;
    armTotalL = armTotalR = tSeatsPerRow * tRows;
  } else if (dir === "toward"){
    // toward crossing: depth along arm length, seat-axis +y
    tRows = Math.max(0, Math.floor(tl / pitch + 1e-9));
    const segs = (TS.mode==="custom" && Array.isArray(TS.custom))
      ? sectionsCustom(TS.custom).segs
      : sectionsEqual(TS, tw, TS.edgeAisle, TS.edgeAisle);
    for (let r=0;r<tRows;r++){
      const xRightL = (cx-halfNW) - r*pitch, xLeftL = xRightL - sD;
      const xLeftR  = (cx+halfNW) + r*pitch;
      for (const seg of segs){
        const seats = segSeats(seg.size); if (seats<=0) continue;
        bars.push(makeBar(xLeftL, (cy-halfTW)+seg.start, 0,seg.size, sD,0, seats));
        bars.push(makeBar(xLeftR, (cy-halfTW)+seg.start, 0,seg.size, sD,0, seats));
      }
    }
    tSeatsPerRow = sumSeats(segs);
    tSecCount = segs.length;
    armTotalL = armTotalR = tSeatsPerRow * tRows;
  } else { // angled at altar: rotate the arm into the seat frame, then fill with rows.
    // Compute the LEFT arm directly, then mirror across x=cx to get the RIGHT
    // arm — guarantees mirror symmetry no matter what the rotation math does.
    const pivL = {x:cx-halfNW, y:cy};
    const angL = Math.atan2(altar.cy-pivL.y, altar.cx-pivL.x);
    // Edge aisles run parallel to the walls, so carve them off the arm rectangle
    // (outer + both long walls) BEFORE rotating; the crossing side stays open.
    const ea = Math.min(Math.max(0, +TS.edgeAisle || 0), halfTW - sW, tl - sW);
    const armRectL = {xMin: xL+ea, xMax: cx-halfNW, yMin: cy-halfTW+ea, yMax: cy+halfTW-ea};
    const resL = buildAngledArm(pivL, angL, armRectL, TS, sW, sD, pitch);
    const mirrorX = p => ({x: 2*cx - p.x, y: p.y});
    const mirrorBars = resL.bars.map(b => ({
      a: mirrorX(b.a), b: mirrorX(b.b), c: mirrorX(b.c), d: mirrorX(b.d), seats: b.seats,
    }));
    bars.push(...resL.bars, ...mirrorBars);
    tRows = resL.rows;
    tSeatsPerRow = resL.maxSeatsPerRow;
    tSecCount = resL.secCount;
    armTotalL = armTotalR = resL.totalSeats;
  }

  const armTotal = Math.round((armTotalL + armTotalR) / 2);
  const transeptTotal = armTotalL + armTotalR;
  const total = naveTotal + transeptTotal;

  const stats = {
    total,
    naveRows, naveSeatsPerRow, naveTotal, naveSec:naveSecCount,
    tRows, tSeatsPerRow, armTotal, transeptTotal, tSec:tSecCount,
    totalRows: naveRows + 2*tRows,
    footW: xR - xL, footH: naveBottom - chancelTopY,
  };
  return {outline, altar, bars, bounds, stats};
}

/* ====================== rendering ====================== */
const CV = document.getElementById("cv");
const DPR = window.devicePixelRatio || 1;
function setupCanvas(canvas, cssW, cssH){
  canvas.width = Math.round(cssW*DPR); canvas.height = Math.round(cssH*DPR);
  canvas.style.width = cssW+"px"; canvas.style.height = cssH+"px";
  canvas._w = cssW; canvas._h = cssH;
}
setupCanvas(CV, 900, 680);

function render(cfg, canvas, opts){
  canvas = canvas || CV; opts = opts || {};
  const W = canvas._w, H = canvas._h;
  const PAD = Math.max(8, Math.round(Math.min(W,H)*0.04));
  const fScale = Math.max(0.7, Math.min(1, W/900));
  const m = buildModel(cfg);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  const fw = Math.max(1, m.bounds.maxX-m.bounds.minX);
  const fh = Math.max(1, m.bounds.maxY-m.bounds.minY);
  const fitScale = opts.scale != null ? opts.scale : Math.min((W-2*PAD)/fw, (H-2*PAD)/fh);  // opts.scale = shared (summary)
  const zoom = opts.zoom || 1;
  const s = fitScale * zoom;
  const ox = (W - fw*s)/2 + (opts.panX || 0);
  const oy = (H - fh*s)/2 + (opts.panY || 0);
  const X = x => ox + (x-m.bounds.minX)*s;
  const Y = y => oy + (y-m.bounds.minY)*s;
  const poly = (pts) => { ctx.beginPath(); pts.forEach((p,i)=> i? ctx.lineTo(X(p.x),Y(p.y)) : ctx.moveTo(X(p.x),Y(p.y))); ctx.closePath(); };

  poly(m.outline);
  ctx.fillStyle="#fff"; ctx.fill();
  ctx.save();
  poly(m.outline); ctx.clip();

  const tan = getCss("--tan"), tanStroke = getCss("--tanstroke");
  ctx.lineWidth = 1;
  for (const bar of m.bars){
    ctx.beginPath();
    ctx.moveTo(X(bar.a.x),Y(bar.a.y));
    ctx.lineTo(X(bar.b.x),Y(bar.b.y));
    ctx.lineTo(X(bar.c.x),Y(bar.c.y));
    ctx.lineTo(X(bar.d.x),Y(bar.d.y));
    ctx.closePath();
    ctx.fillStyle = tan; ctx.fill();
    ctx.strokeStyle = tanStroke; ctx.stroke();
    if (bar.seats>1 && s*dist(bar.a,bar.b)/bar.seats > 3){
      ctx.beginPath();
      for (let i=1;i<bar.seats;i++){
        const t=i/bar.seats;
        const p={x:bar.a.x+(bar.b.x-bar.a.x)*t, y:bar.a.y+(bar.b.y-bar.a.y)*t};
        const q={x:p.x+(bar.d.x-bar.a.x), y:p.y+(bar.d.y-bar.a.y)};
        ctx.moveTo(X(p.x),Y(p.y)); ctx.lineTo(X(q.x),Y(q.y));
      }
      ctx.strokeStyle="rgba(160,125,79,.55)"; ctx.stroke();
    }
  }
  ctx.restore();

  const a=m.altar;
  ctx.fillStyle=getCss("--accent");
  ctx.fillRect(X(a.cx-a.w/2), Y(a.cy-a.h/2), a.w*s, a.h*s);

  poly(m.outline);
  ctx.lineWidth=Math.max(1.2, 2.5*W/900); ctx.strokeStyle="#000"; ctx.stroke();

  const ts=Math.round(14*fScale), ss=Math.round(12*fScale);
  ctx.fillStyle="#000"; ctx.font=`600 ${ts}px system-ui,Segoe UI,Arial`; ctx.textAlign="left";
  ctx.fillText(cfg.name, 10, ts+6);
  ctx.font=`${ss}px system-ui,Segoe UI,Arial`; ctx.fillStyle="#555";
  ctx.fillText(`${m.stats.total} seats · ${Math.round(m.stats.footW)}′ × ${Math.round(m.stats.footH)}′`, 10, ts+ss+10);
  ctx.fillStyle=getCss("--accent"); ctx.font=`600 ${Math.max(9,Math.round(11*fScale))}px system-ui,Arial`; ctx.textAlign="center";
  ctx.fillText("ALTAR", X(a.cx), Y(a.cy-a.h/2)-3);
  ctx.textAlign="left";

  return m.stats;
}
function dist(p,q){return Math.hypot(p.x-q.x,p.y-q.y);}
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

/* ====================== stats + comparison ====================== */
function renderStats(stats){
  const el=document.getElementById("stats");
  const cell=(v,k,big)=>`<div class="stat ${big?'big':''}"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  el.innerHTML =
    cell(stats.total, "Total seats", true) +
    cell(stats.naveTotal, `Nave total (${stats.naveSeatsPerRow}/row × ${stats.naveRows} rows)`) +
    cell(stats.transeptTotal, `Transepts total (both arms)`) +
    cell(stats.naveSeatsPerRow, `Seats per nave row · ${stats.naveSec} section${stats.naveSec===1?'':'s'}`) +
    cell(stats.tSeatsPerRow, `Seats per transept row · ${stats.tSec} section${stats.tSec===1?'':'s'}`) +
    cell(stats.tRows, `Transept rows (per arm)`) +
    cell(stats.armTotal, `Seats per transept arm`) +
    cell(stats.totalRows, `Total rows (nave + both arms)`);
}
function renderCompare(){
  const t=document.getElementById("cmp");
  const rows=[
    ["Total seats", s=>s.total],
    ["Nave seats/row", s=>s.naveSeatsPerRow],
    ["Nave rows", s=>s.naveRows],
    ["Nave total", s=>s.naveTotal],
    ["Transept seats/row", s=>s.tSeatsPerRow],
    ["Transept rows/arm", s=>s.tRows],
    ["Transept total", s=>s.transeptTotal],
    ["Footprint (ft)", s=>`${Math.round(s.footW)}×${Math.round(s.footH)}`],
  ];
  const stats=state.tabs.map(c=>buildModel(c).stats);
  let html="<thead><tr><th>Metric</th>"+state.tabs.map(c=>`<th>${escapeHtml(c.name)}</th>`).join("")+"</tr></thead><tbody>";
  for(const [label,fn] of rows) html+="<tr><td>"+label+"</td>"+stats.map(s=>`<td>${fn(s)}</td>`).join("")+"</tr>";
  html+="</tbody>";
  t.innerHTML = html;
  t.style.display = "table";
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

/* ====================== small numeric helpers ====================== */
function numOr(v,d){ const n=+v; return Number.isFinite(n)?n:d; }
function intOr(v,d){ const n=Math.round(+v); return Number.isFinite(n)?n:d; }
function round1(x){ return Math.round(x*10)/10; }
function customTotal(list){ return (list||[]).reduce((a,it)=>a+Math.max(0,+it.width||0),0); }
function customSectionWidths(list){ return (list||[]).filter(it=>it.type==="section").map(it=>+it.width||0); }
function customHasUnequalSections(list){
  const ws=customSectionWidths(list);
  for(let i=1;i<ws.length;i++) if(Math.abs(ws[i]-ws[0])>0.01) return true;
  return false;
}
function newSectionWidth(s, target){ const rem=target-customTotal(s.custom); return rem>1?round1(rem):12; }
function makeCustomFromEqual(s, target, seatsMode){
  const n=Math.max(1,Math.round(s.sections));
  // section width unit depends on input mode: seats (seats mode) or feet (dimensions)
  const lay=layoutSections(target, n, +s.centerAisle, +s.nonCenterAisle, +s.edgeAisle);
  const feetSize = lay.size>0 ? lay.size : Math.max(1, round1(target/(n*2)));
  const secWidth = seatsMode ? Math.max(1, Math.round(s.seatsPerSection||1)) : round1(feetSize);
  const list=[];
  if (+s.edgeAisle>0) list.push({type:"aisle", width:round1(+s.edgeAisle)});
  for (let i=0;i<n;i++){
    list.push({type:"section", width:secWidth});
    if (i<n-1){
      const isCenter=(n%2===0)&&(i===n/2-1);
      list.push({type:"aisle", width:round1(isCenter?+s.centerAisle:+s.nonCenterAisle)});
    }
  }
  if (+s.edgeAisle>0) list.push({type:"aisle", width:round1(+s.edgeAisle)});
  return list;
}

/* ====================== controls ====================== */
function fieldset(title){ const fs=document.createElement("fieldset"); const lg=document.createElement("legend"); lg.textContent=title; fs.appendChild(lg); return fs; }
function subheading(t){ const d=document.createElement("div"); d.className="subhead"; d.textContent=t; return d; }

function numField(obj, key, meta){
  const row=document.createElement("div"); row.className="field";
  row.innerHTML=`<label>${meta.l}</label><input type="number" value="${obj[key]}" step="${meta.step}" ${meta.min!=null?`min="${meta.min}"`:""}>`;
  const inp=row.querySelector("input");
  inp.addEventListener("input",()=>{ let v=+inp.value; if(meta.int) v=Math.round(v); obj[key]=v; refresh(); });
  if (meta.affectsTarget) inp.addEventListener("change",()=>buildControls()); // refresh target badge on blur
  return row;
}
function rangeField(obj, key, meta){
  const row=document.createElement("div"); row.className="field range";
  row.innerHTML=`<label>${meta.l}</label><input type="number" value="${obj[key]}" step="${meta.step}" min="${meta.min}">`;
  const num=row.querySelector("input");
  const sl=document.createElement("input"); sl.type="range"; sl.min=meta.min; sl.max=meta.max; sl.step=meta.step; sl.value=obj[key]; sl.style.gridColumn="1 / -1";
  sl.addEventListener("input",()=>{ obj[key]=+sl.value; num.value=sl.value; refresh(); });
  num.addEventListener("input",()=>{ obj[key]=+num.value; sl.value=num.value; refresh(); });
  row.appendChild(sl); return row;
}
function selectField(obj, key, label, opts, onChange){
  const row=document.createElement("div"); row.className="field";
  row.innerHTML=`<label>${label}</label><select>`+opts.map(o=>`<option value="${o[0]}" ${obj[key]===o[0]?"selected":""}>${o[1]}</option>`).join("")+`</select>`;
  row.querySelector("select").addEventListener("change",e=>{ if(onChange) onChange(e.target.value); else { obj[key]=e.target.value; refresh(); } });
  return row;
}

function buildControls(){
  const cfg = state.tabs[state.active];
  const wrap = document.getElementById("controls");
  wrap.innerHTML="";

  const seatsMode = cfg.inputMode === "seats";

  // tab name + input mode
  const nameFs=fieldset("Tab");
  const nameRow=document.createElement("div"); nameRow.className="field full";
  nameRow.innerHTML=`<input type="text" value="${escapeHtml(cfg.name)}">`;
  nameRow.querySelector("input").addEventListener("input",e=>{ cfg.name=e.target.value; buildTabs(); refresh(); });
  nameFs.appendChild(nameRow);
  nameFs.appendChild(selectField(cfg,"inputMode","Input mode",
    [["dimensions","Dimensions → seats"],["seats","Seats → dimensions"]],
    v=>{ setInputMode(cfg, v); }));
  nameFs.appendChild(inputModeHint(seatsMode));
  wrap.appendChild(nameFs);

  // NAVE
  const naveFs=fieldset("Nave");
  naveFs.appendChild(subheading("Dimensions"));
  if (seatsMode){
    naveFs.appendChild(numField(cfg,"naveRows",{l:"Rows", min:0, step:1, int:true}));
    naveFs.appendChild(dimReadout("naveDimReadout", cfg));
  } else {
    naveFs.appendChild(numField(cfg,"naveLength",NUM.naveLength));
    naveFs.appendChild(numField(cfg,"naveWidth",NUM.naveWidth));
  }
  naveFs.appendChild(subheading("Seating / Aisles"));
  renderSeatingEditor(naveFs, cfg, "naveSeating", +cfg.naveWidth, "nave width", seatsMode);
  wrap.appendChild(naveFs);

  // TRANSEPT
  const tFs=fieldset("Transept");
  tFs.appendChild(subheading("Dimensions"));
  tFs.appendChild(selectField(cfg,"transeptDir","Transept seat direction",
    [["forward","Forward (face altar end)"],["toward","Toward crossing"],["angled","Angled at altar"]],
    v=>{ cfg.transeptDir=v; buildControls(); refresh(); }));
  const tForward = cfg.transeptDir==="forward";
  const tAngled  = cfg.transeptDir==="angled";
  if (seatsMode && !tAngled){
    tFs.appendChild(numField(cfg,"transeptRows",{l:tForward?"Rows per arm (depth)":"Rows per arm", min:0, step:1, int:true}));
    if (tForward) tFs.appendChild(numField(cfg,"transeptFrontGap",NUM.transeptFrontGap));
    tFs.appendChild(dimReadout("transeptDimReadout", cfg));
  } else {
    tFs.appendChild(numField(cfg,"transeptLength",NUM.transeptLength));
    tFs.appendChild(numField(cfg,"transeptWidth",NUM.transeptWidth));
    tFs.appendChild(numField(cfg,"transeptFrontGap",NUM.transeptFrontGap));
    if (seatsMode && tAngled){
      const note=document.createElement("div"); note.className="cust-hint";
      note.textContent="Angled transepts vary row length, so their size stays in feet even in seats mode.";
      tFs.appendChild(note);
    }
  }
  tFs.appendChild(subheading("Seating / Aisles"));
  renderSeatingEditor(tFs, cfg, "transeptSeating", tForward?+cfg.transeptLength:+cfg.transeptWidth, tForward?"transept length":"transept width", seatsMode && !tAngled);
  wrap.appendChild(tFs);

  // PER-SEAT
  const sFs=fieldset("Per-seat (seats connected side-to-side)");
  sFs.appendChild(numField(cfg,"seatWidth",NUM.seatWidth));
  sFs.appendChild(numField(cfg,"seatDepth",NUM.seatDepth));
  sFs.appendChild(numField(cfg,"legSpace",NUM.legSpace));
  wrap.appendChild(sFs);

  // ALTAR
  const aFs=fieldset("Altar");
  aFs.appendChild(rangeField(cfg,"altarDistance",NUM.altarDistance));
  aFs.appendChild(numField(cfg,"altarWidth",NUM.altarWidth));
  aFs.appendChild(numField(cfg,"altarDepth",NUM.altarDepth));
  aFs.appendChild(numField(cfg,"frontToAltar",NUM.frontToAltar));
  wrap.appendChild(aFs);
}

/* ---- seats-first UI helpers ---- */
function setInputMode(cfg, mode){
  if (mode === cfg.inputMode){ buildControls(); return; }
  const sW = +cfg.seatWidth;
  if (mode === "seats"){
    // seed seat counts from the current geometry so the layout stays put
    const st = buildModel(cfg).stats;
    cfg.naveRows = st.naveRows;
    cfg.transeptRows = st.tRows;
    seedSeatsFromDims(cfg.naveSeating, sW, st.naveSeatsPerRow);
    seedSeatsFromDims(cfg.transeptSeating, sW, st.tSeatsPerRow);
    cfg.inputMode = "seats";
  } else {
    // bake the seats-derived feet dimensions back into the feet fields
    const r = resolveConfig(cfg);
    cfg.naveWidth = round1(r.naveWidth); cfg.naveLength = round1(r.naveLength);
    cfg.transeptWidth = round1(r.transeptWidth); cfg.transeptLength = round1(r.transeptLength);
    convertCustomUnits(cfg.naveSeating, sW, false);      // seats -> feet
    convertCustomUnits(cfg.transeptSeating, sW, false);
    cfg.inputMode = "dimensions";
  }
  buildControls(); refresh();
}
function seedSeatsFromDims(seat, sW, seatsPerRow){
  if (seat.mode === "custom" && Array.isArray(seat.custom)){
    convertCustomUnits(seat, sW, true);                  // feet -> seats
  } else {
    const n = Math.max(1, Math.round(seat.sections));
    seat.seatsPerSection = Math.max(1, Math.round((seatsPerRow||0)/n) || seat.seatsPerSection || 1);
  }
}
function convertCustomUnits(seat, sW, toSeats){
  if (!(seat.mode === "custom" && Array.isArray(seat.custom))) return;
  seat.custom = seat.custom.map(it => it.type === "section"
    ? { type:"section", width: toSeats ? Math.max(0, Math.round((+it.width||0)/sW))
                                       : round1(Math.max(0, +it.width||0) * sW) }
    : { type:"aisle", width: round1(Math.max(0, +it.width||0)) });
}
function inputModeHint(seatsMode){
  const d = document.createElement("div"); d.className = "cust-hint";
  d.textContent = seatsMode
    ? "Enter rows and seats-per-section; nave/transept dimensions are computed."
    : "Enter dimensions in feet; seat counts are computed.";
  return d;
}
function dimReadout(id, cfg){
  const d = document.createElement("div"); d.className = "cust-total"; d.id = id;
  d.innerHTML = dimReadoutHtml(id, cfg);
  return d;
}
function dimReadoutHtml(id, cfg){
  const r = resolveConfig(cfg);
  if (id === "naveDimReadout")
    return `Computed nave: <b>${round1(r.naveWidth)}′</b> wide × <b>${round1(r.naveLength)}′</b> long`;
  return `Computed transept (per arm): <b>${round1(r.transeptWidth)}′</b> × <b>${round1(r.transeptLength)}′</b>`;
}
function seatsTotalText(s, sW){
  const secSeats = (s.custom||[]).filter(it=>it.type==="section")
                     .reduce((a,it)=>a+Math.max(0,Math.round(+it.width||0)),0);
  const feet = computeAlongRowFeet(s, sW, 0, 0);         // custom carries its own aisles
  return `Layout total: <b>${secSeats} seats</b> · <b>${round1(feet)} ft</b> across`;
}

function renderSeatingEditor(parent, cfg, key, target, axisLabel, seatsMode){
  const s = cfg[key];
  parent.appendChild(selectField(s, "mode", "Seat Section Widths",
    [["equal","Equal"],["custom","Custom"]],
    v=> onSeatingModeChange(cfg, key, v, target, seatsMode)));
  if (s.mode === "equal"){
    parent.appendChild(numField(s,"sections",{l:"Sections", min:1, step:1, int:true}));
    if (seatsMode) parent.appendChild(numField(s,"seatsPerSection",{l:"Seats per section", min:1, step:1, int:true}));
    parent.appendChild(numField(s,"edgeAisle",{l:"Edge aisle (by walls)", min:0, step:0.5}));
    parent.appendChild(numField(s,"centerAisle",{l:"Center aisle (even #)", min:0, step:0.5}));
    parent.appendChild(numField(s,"nonCenterAisle",{l:"Between-section aisle", min:0, step:0.5}));
  } else {
    parent.appendChild(renderCustomEditor(cfg, key, target, axisLabel, seatsMode));
  }
}

function onSeatingModeChange(cfg, key, v, target, seatsMode){
  const s = cfg[key];
  if (v === "custom"){
    if (!Array.isArray(s.custom) || s.custom.length === 0) s.custom = makeCustomFromEqual(s, target, seatsMode);
    s.mode = "custom";
  } else {
    if (Array.isArray(s.custom) && customHasUnequalSections(s.custom)){
      const okSwitch = confirm("This area's custom layout has unequal section widths.\n\nSwitching to Equal will replace them with evenly-sized sections. Continue?\n(Your custom layout is kept and restored if you switch back.)");
      if (!okSwitch){ buildControls(); return; } // re-render keeps Custom selected
    }
    s.mode = "equal";
  }
  buildControls(); refresh();
}

function renderCustomEditor(cfg, key, target, axisLabel, seatsMode){
  const s = cfg[key];
  const box = document.createElement("div"); box.className="custombox";

  const totalDiv = document.createElement("div"); totalDiv.className="cust-total";
  const updateTotal = ()=>{ totalDiv.innerHTML = seatsMode ? seatsTotalText(s, +cfg.seatWidth) : totalText(customTotal(s.custom), target, axisLabel); };

  const list = document.createElement("div"); list.className="dndlist";
  s.custom.forEach((it,i)=> list.appendChild(customItemRow(cfg, key, i, updateTotal, seatsMode)));
  box.appendChild(list);

  const btns = document.createElement("div"); btns.className="addbtns";
  const addSec=document.createElement("button"); addSec.className="btn sm"; addSec.textContent="+ Section";
  const secDefault = seatsMode ? Math.max(1, Math.round(s.seatsPerSection||6)) : newSectionWidth(s,target);
  addSec.addEventListener("click",()=>{ s.custom.push({type:"section", width:secDefault}); buildControls(); refresh(); });
  const addAisle=document.createElement("button"); addAisle.className="btn sm"; addAisle.textContent="+ Aisle";
  addAisle.addEventListener("click",()=>{ s.custom.push({type:"aisle", width:4}); buildControls(); refresh(); });
  btns.appendChild(addSec); btns.appendChild(addAisle);
  box.appendChild(btns);

  updateTotal();
  box.appendChild(totalDiv);

  const hint=document.createElement("div"); hint.className="cust-hint";
  hint.textContent = (seatsMode ? "Section widths are in seats, aisles in feet. " : "")
    + "Order runs across the "+axisLabel+"; drag ⋮⋮ to reorder. Transept layouts mirror to both arms.";
  box.appendChild(hint);
  return box;
}

function customItemRow(cfg, key, i, updateTotal, seatsMode){
  const s = cfg[key]; const it = s.custom[i];
  const isSec = it.type==="section";
  const seatUnit = seatsMode && isSec;
  const row = document.createElement("div");
  row.className = "dnditem " + (isSec ? "is-section" : "is-aisle");
  row.innerHTML = `<span class="grip" title="Drag to reorder">⋮⋮</span>
    <span class="tag">${isSec?"Section":"Aisle"}</span>
    <input type="number" value="${it.width}" step="${seatUnit?"1":"0.5"}" min="0">
    <span class="unit">${seatUnit?"seats":"ft"}</span>
    <button class="del" title="Remove">×</button>`;

  row.querySelector("input").addEventListener("input", e=>{ it.width=+e.target.value; updateTotal(); refresh(); });
  row.querySelector(".del").addEventListener("click", ()=>{ s.custom.splice(i,1); buildControls(); refresh(); });

  const grip = row.querySelector(".grip");
  grip.draggable = true;
  grip.addEventListener("dragstart", e=>{ dragState={key, from:i}; row.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",String(i)); });
  grip.addEventListener("dragend", ()=>{ row.classList.remove("dragging"); });
  row.addEventListener("dragover", e=>{ if(dragState && dragState.key===key){ e.preventDefault(); row.classList.add("over"); } });
  row.addEventListener("dragleave", ()=> row.classList.remove("over"));
  row.addEventListener("drop", e=>{
    e.preventDefault(); row.classList.remove("over");
    if(!dragState || dragState.key!==key) return;
    const from=dragState.from; dragState=null;
    if(from===i) return;
    const arr=s.custom; const [moved]=arr.splice(from,1); arr.splice(i,0,moved);
    buildControls(); refresh();
  });
  return row;
}

function totalText(tot, target, axisLabel){
  const diff = tot - target;
  let cls, note;
  if (Math.abs(diff) < 0.05){ cls="ok"; note="matches "+axisLabel; }
  else if (diff > 0){ cls="over"; note=round1(diff)+" ft over "+axisLabel; }
  else { cls="under"; note=round1(-diff)+" ft under "+axisLabel; }
  return `Layout total: <b>${round1(tot)} ft</b> · target ${round1(target)} ft <span class="badge ${cls}">${note}</span>`;
}

/* ====================== tabs ====================== */
function buildTabs(){
  const bar=document.getElementById("tabsbar");
  bar.innerHTML="";

  // Summary tab — always first
  const sum=document.createElement("div");
  sum.className="tab summary-tab"+(state.view==="summary"?" active":"");
  sum.innerHTML="<span>▦ Summary</span>";
  sum.addEventListener("click",()=>showSummary());
  bar.appendChild(sum);

  // editing tabs
  state.tabs.forEach((c,i)=>{
    const tab=document.createElement("div");
    tab.className="tab"+(state.view==="edit" && i===state.active?" active":"");
    tab.innerHTML=`<span>${escapeHtml(c.name)}</span>`;
    tab.querySelector("span").addEventListener("click",()=>showEdit(i));
    tab.querySelector("span").addEventListener("dblclick",()=>{
      const n=prompt("Rename tab:",c.name); if(n!=null){ c.name=n; buildTabs(); refresh(); }
    });
    if(state.tabs.length>1){
      const x=document.createElement("button"); x.className="x"; x.textContent="×"; x.title="Close tab";
      x.addEventListener("click",ev=>{ ev.stopPropagation(); closeTab(i); });
      tab.appendChild(x);
    }
    bar.appendChild(tab);
  });

  const add=document.createElement("button"); add.className="btn"; add.textContent="+ Add";
  add.addEventListener("click",()=>{ state.tabs.push(defaultConfig(nextName())); state.viewports.push(defaultViewport()); showEdit(state.tabs.length-1); });
  const dup=document.createElement("button"); dup.className="btn"; dup.textContent="⧉ Duplicate";
  dup.addEventListener("click",()=>{ const base=Math.max(0,Math.min(state.active,state.tabs.length-1)); const c=JSON.parse(JSON.stringify(state.tabs[base])); c.name=nextName(); state.tabs.push(c); state.viewports.push(defaultViewport()); showEdit(state.tabs.length-1); });
  const tools=document.createElement("div"); tools.className="toolbar"; tools.appendChild(add); tools.appendChild(dup);
  bar.appendChild(tools);
}

function showEdit(i){
  state.view="edit"; state.active=i;
  document.getElementById("main").classList.remove("summary");
  buildTabs(); buildControls(); refresh();
}
function showSummary(){
  state.view="summary";
  document.getElementById("main").classList.add("summary");
  buildTabs(); refresh();
}
function closeTab(i){
  state.tabs.splice(i,1);
  state.viewports.splice(i,1);
  if(state.active>=state.tabs.length) state.active=state.tabs.length-1;
  if(state.active<0) state.active=0;
  if(state.view==="edit") showEdit(state.active);
  else { buildTabs(); refresh(); }
}
function nextName(){
  const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(const ch of letters){ const n="Option "+ch; if(!state.tabs.some(t=>t.name===n)) return n; }
  return "Option "+(state.tabs.length+1);
}

// Size the editing canvas to fill its container, then draw the active tab.
function renderEditCanvas(){

  const h=Math.max(220, Math.floor(wrap.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)));

function renderSummary(){
  const wrap=document.getElementById("summaryImages");
  wrap.innerHTML="";
  // One shared scale across all tabs so footprints are visually comparable:
  // pick the scale at which the largest footprint just fits a thumbnail.
  const TW=420, TH=330, PAD=Math.max(8,Math.round(Math.min(TW,TH)*0.04));
  let maxFw=1, maxFh=1;
  state.tabs.forEach(cfg=>{ const b=buildModel(cfg).bounds; maxFw=Math.max(maxFw, b.maxX-b.minX); maxFh=Math.max(maxFh, b.maxY-b.minY); });
  const shared=Math.min((TW-2*PAD)/maxFw, (TH-2*PAD)/maxFh);
  state.tabs.forEach((cfg,i)=>{
    const card=document.createElement("div"); card.className="sumcard"; card.title="Click to edit "+cfg.name;
    const cv=document.createElement("canvas"); setupCanvas(cv, TW, TH);
    card.appendChild(cv);
    const cap=document.createElement("div"); cap.className="sumcap"; cap.textContent="✎ Edit "+cfg.name;
    card.appendChild(cap);
    card.addEventListener("click",()=>showEdit(i));
    wrap.appendChild(card);
    render(cfg, cv, {scale:shared});
  });
  renderCompare();
}

/* ====================== serialization ====================== */
function encodeCfg(cfg){
  const json=JSON.stringify(cfg);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodeCfg(str){
  let s=str.trim().replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4) s+="=";
  return JSON.parse(decodeURIComponent(escape(atob(s))));
}
function sanitizeCustom(list){
  return list.filter(it=>it && (it.type==="section"||it.type==="aisle"))
             .map(it=>({type:it.type, width:Math.max(0, numOr(it.width,0))}));
}
function normalizeSeating(seat, legacy, def){
  const out={ mode:"equal", sections:def.sections, seatsPerSection:def.seatsPerSection, edgeAisle:def.edgeAisle, centerAisle:def.centerAisle, nonCenterAisle:def.nonCenterAisle, custom:null };
  if (seat && typeof seat==="object"){
    out.mode = seat.mode==="custom" ? "custom" : "equal";
    out.sections = intOr(seat.sections, def.sections);
    out.seatsPerSection = intOr(seat.seatsPerSection, def.seatsPerSection);
    out.edgeAisle = numOr(seat.edgeAisle, def.edgeAisle);
    out.centerAisle = numOr(seat.centerAisle, def.centerAisle);
    out.nonCenterAisle = numOr(seat.nonCenterAisle, def.nonCenterAisle);
    out.custom = Array.isArray(seat.custom) ? sanitizeCustom(seat.custom) : null;
    if (out.mode==="custom" && !out.custom) out.custom=[];
  } else { // legacy flat fields (older serialized configs) -> Equal mode
    out.sections = intOr(legacy.sections, def.sections);
    out.edgeAisle = numOr(legacy.edgeAisle, def.edgeAisle);
    out.centerAisle = numOr(legacy.centerAisle, def.centerAisle);
    out.nonCenterAisle = numOr(legacy.nonCenterAisle, def.nonCenterAisle);
  }
  return out;
}
// Fill any missing fields with defaults so older/partial share strings keep working.
function mergeDefaults(c){
  if (!c || typeof c!=="object") c={};
  const def=defaultConfig(typeof c.name==="string" && c.name ? c.name : "Option A");
  const merged=Object.assign({}, def, c);
  merged.name = (typeof c.name==="string" && c.name) ? c.name : def.name;
  merged.inputMode = c.inputMode==="seats" ? "seats" : "dimensions";
  merged.naveRows = intOr(c.naveRows, def.naveRows);
  merged.transeptRows = intOr(c.transeptRows, def.transeptRows);
  merged.transeptDir = ["forward","toward","angled"].includes(c.transeptDir) ? c.transeptDir : def.transeptDir;
  merged.naveSeating = normalizeSeating(c.naveSeating,
    {sections:c.naveSections, edgeAisle:c.edgeAisle, centerAisle:c.centerAisle, nonCenterAisle:c.nonCenterAisle}, def.naveSeating);
  merged.transeptSeating = normalizeSeating(c.transeptSeating,
    {sections:c.transeptSections, edgeAisle:c.edgeAisle, centerAisle:c.centerAisle, nonCenterAisle:c.nonCenterAisle}, def.transeptSeating);
  // drop obsolete flat seating keys
  delete merged.naveSections; delete merged.transeptSections;
  delete merged.centerAisle; delete merged.nonCenterAisle; delete merged.edgeAisle;
  for (const k of SIMPLE_NUM_KEYS) merged[k]=numOr(merged[k], def[k]);
  return merged;
}

/* ====================== zoom / pan + sidebar controls ====================== */
const ZOOM_MIN = 1, ZOOM_MAX = 8;
function zoomAtCursor(cssX, cssY, factor, vp){
  const W = CV._w, H = CV._h;
  const PAD = Math.max(8, Math.round(Math.min(W,H)*0.04));
  const cfg = state.tabs[state.active]; if (!cfg) return;
  const m = buildModel(cfg);
  const fw = Math.max(1, m.bounds.maxX-m.bounds.minX);
  const fh = Math.max(1, m.bounds.maxY-m.bounds.minY);
  const baseScale = Math.min((W-2*PAD)/fw, (H-2*PAD)/fh);
  const s0 = baseScale * vp.zoom;
  const ox0 = (W - fw*s0)/2 + vp.panX, oy0 = (H - fh*s0)/2 + vp.panY;
  // world point (in feet from minX,minY) under the cursor
  const wx = (cssX - ox0) / s0, wy = (cssY - oy0) / s0;
  const newZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, vp.zoom * factor));
  const s1 = baseScale * newZoom;
  vp.zoom = newZoom;
  vp.panX = cssX - (W - fw*s1)/2 - wx*s1;
  vp.panY = cssY - (H - fh*s1)/2 - wy*s1;
  // when fully zoomed out, recenter so we don't leave an off-center fit-view
  if (newZoom === 1){ vp.panX = 0; vp.panY = 0; }
}

function resetView(){
  const vp = activeVP(); vp.zoom = 1; vp.panX = 0; vp.panY = 0;
  refresh();
}

function attachViewportControls(){
  const wrap = document.getElementById("canvasWrap");
  const pointers = new Map();  // pointerId -> {x,y}
  let pinch = null;            // {startD, midX, midY, startVP}

  wrap.addEventListener("wheel", e=>{
    if (state.view !== "edit") return;
    e.preventDefault();
    const rect = CV.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    const factor = Math.exp(-e.deltaY * 0.0015);
    zoomAtCursor(cx, cy, factor, activeVP());
    refresh();
  }, {passive:false});

  wrap.addEventListener("pointerdown", e=>{
    if (state.view !== "edit") return;
    if (e.target.closest && e.target.closest(".canvas-controls")) return;  // let zoom buttons handle their own clicks
    try { wrap.setPointerCapture(e.pointerId); } catch(_) {}
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    wrap.classList.add("dragging");
    if (pointers.size === 2){
      const pts = Array.from(pointers.values());
      pinch = {
        startD: Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y),
        midX: (pts[0].x+pts[1].x)/2, midY: (pts[0].y+pts[1].y)/2,
        startVP: { ...activeVP() },
      };
    }
  });

  wrap.addEventListener("pointermove", e=>{
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pointers.size >= 2 && pinch){
      const pts = Array.from(pointers.values());
      const d = Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y);
      const vp = activeVP();
      vp.zoom = pinch.startVP.zoom; vp.panX = pinch.startVP.panX; vp.panY = pinch.startVP.panY;
      const rect = CV.getBoundingClientRect();
      const cx = pinch.midX - rect.left, cy = pinch.midY - rect.top;
      zoomAtCursor(cx, cy, d / pinch.startD, vp);
      refresh();
    } else if (pointers.size === 1){
      const vp = activeVP();
      vp.panX += e.clientX - prev.x;
      vp.panY += e.clientY - prev.y;
      refresh();
    }
  });

  const endPointer = e=>{
    if (pointers.has(e.pointerId)) pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) wrap.classList.remove("dragging");
  };
  wrap.addEventListener("pointerup", endPointer);
  wrap.addEventListener("pointercancel", endPointer);
  wrap.addEventListener("pointerleave", endPointer);

  document.getElementById("zoomIn").addEventListener("click",()=>{
    const r = CV.getBoundingClientRect();
    zoomAtCursor(r.width/2, r.height/2, 1.25, activeVP()); refresh();
  });
  document.getElementById("zoomOut").addEventListener("click",()=>{
    const r = CV.getBoundingClientRect();
    zoomAtCursor(r.width/2, r.height/2, 0.8, activeVP()); refresh();
  });
  document.getElementById("zoomReset").addEventListener("click", resetView);
}

function setSidebar(state_){
  state.sidebar = state_;
  const main = document.getElementById("main");
  main.classList.toggle("collapsed", state.sidebar === "collapsed");
  // grid columns changed → editing canvas needs to refit
  if (state.view === "edit") refresh();
}
function attachSidebarControls(){
  document.getElementById("sidebarToggle").addEventListener("click",()=>{
    setSidebar(state.sidebar === "open" ? "collapsed" : "open");
  });
  document.getElementById("backdrop").addEventListener("click",()=>{
    setSidebar("collapsed");
  });
}

/* ====================== resize + init ====================== */
let _resizeT=null;
window.addEventListener("resize",()=>{ clearTimeout(_resizeT); _resizeT=setTimeout(refresh,120); });

(function init(){
  const params=new URLSearchParams(location.search);
  const c=params.get("c");
  if(c){
    try{ state.tabs=[mergeDefaults(decodeCfg(c))]; }
    catch(e){ state.tabs=[defaultConfig("Option A"), defaultConfig("Option B")]; }
  } else {
    state.tabs=[defaultConfig("Option A"), defaultConfig("Option B")];
  }
  state.viewports = state.tabs.map(defaultViewport);
  state.view="edit"; state.active=0;
  // default sidebar: collapsed on narrow screens (mobile drawer), open on desktop
  state.sidebar = (window.matchMedia && window.matchMedia("(max-width: 800px)").matches) ? "collapsed" : "open";
  const main=document.getElementById("main");
  main.classList.remove("summary");
  main.classList.toggle("collapsed", state.sidebar==="collapsed");
  buildTabs(); buildControls(); refresh();
  attachViewportControls();
  attachSidebarControls();
})();
</script>
</body>
</html>
