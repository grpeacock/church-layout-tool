<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cruciform Church Seating Planner</title>
<style>
  :root{
    --bg:#f5f3ee; --panel:#ffffff; --line:#d8d2c4; --ink:#222; --muted:#6b6557;
    --accent:#7a1f1f; --tan:#d2b48c; --tanstroke:#a07d4f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.4 system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  header{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:12px}
  .tabsbar{display:flex;gap:6px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .tab{padding:6px 12px;border:1px solid var(--line);border-radius:7px 7px 0 0;background:#efeae0;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px}
  .tab.active{background:var(--panel);border-bottom-color:var(--panel);font-weight:650}
  .tab .x{color:var(--muted);font-weight:700;border:0;background:none;cursor:pointer;padding:0 2px;line-height:1}
  .tab .x:hover{color:var(--accent)}
  .btn{padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-size:13px}
  .btn:hover{background:#f0ece3}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08)}
  .toolbar{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  main{display:grid;grid-template-columns:330px 1fr;gap:0;height:calc(100% - 0px)}
  .controls{padding:14px 16px;overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
  .stage{padding:14px 16px;overflow:auto}
  fieldset{border:1px solid var(--line);border-radius:9px;margin:0 0 12px;padding:10px 12px}
  legend{font-weight:650;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:0 6px}
  .field{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;margin:7px 0}
  .field label{font-size:13px}
  .field input[type=number],.field input[type=text],.field select{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:6px;font:inherit}
  .field.range{grid-template-columns:1fr 64px}
  .field.range input[type=range]{width:100%}
  .field.full{grid-template-columns:1fr}
  canvas{background:#fff;border:1px solid var(--line);border-radius:10px;max-width:100%;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .stats{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel)}
  .stat .v{font-size:21px;font-weight:700}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat.big .v{color:var(--accent)}
  table.cmp{border-collapse:collapse;margin-top:16px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 9px;text-align:right;font-size:13px}
  table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--muted)}
  table.cmp thead th{background:#efeae0}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 2px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25)}
  .hint{font-size:12px;color:var(--muted);margin:2px 0 10px}
  .row-actions{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>⛪ Cruciform Church Seating Planner</h1>
  <span class="sub">Live layout &amp; seat-count tool · dimensions in feet</span>
</header>

<div class="tabsbar" id="tabsbar"></div>

<main>
  <section class="controls" id="controls"></section>
  <section class="stage">
    <div class="row-actions">
      <button class="btn primary" id="exportBtn">⬇ Export PNG</button>
      <button class="btn" id="linkBtn">🔗 Copy share link</button>
      <button class="btn" id="strBtn">📋 Copy config string</button>
      <button class="btn" id="loadBtn">📥 Load from string</button>
    </div>
    <div class="legend">
      <span><i class="sw" style="background:#fff;border-color:#000"></i> Walls (black)</span>
      <span><i class="sw" style="background:var(--tan);border-color:var(--tanstroke)"></i> Seat rows</span>
      <span><i class="sw" style="background:var(--accent);border-color:var(--accent)"></i> Altar</span>
    </div>
    <canvas id="cv" width="900" height="680"></canvas>
    <div class="stats" id="stats"></div>
    <table class="cmp" id="cmp"></table>
    <p class="hint">Tip: each tab is an independent layout. Switch tabs to compare; the table above summarizes every tab. Share a tab with “Copy share link”.</p>
  </section>
</main>

<script>
"use strict";

/* ---------- configuration model ---------- */
function defaultConfig(name){
  return {
    name: name || "Option A",
    naveLength: 80, naveWidth: 40, naveSections: 2,
    transeptLength: 24, transeptWidth: 30, transeptSections: 1, transeptDir: "toward",
    seatWidth: 1.6, seatDepth: 1.5, legSpace: 1.5,
    centerAisle: 6, nonCenterAisle: 4, edgeAisle: 2,
    altarDistance: 0, altarWidth: 9, altarDepth: 4, frontToAltar: 8,
  };
}

const FIELDS = [
  {g:"Nave", k:"naveLength", l:"Nave length", t:"num", min:0, step:1},
  {g:"Nave", k:"naveWidth", l:"Nave width", t:"num", min:0, step:1},
  {g:"Nave", k:"naveSections", l:"Nave sections", t:"num", min:1, step:1, int:true},

  {g:"Transept", k:"transeptLength", l:"Transept length (per arm)", t:"num", min:0, step:1},
  {g:"Transept", k:"transeptWidth", l:"Transept width (depth)", t:"num", min:0, step:1},
  {g:"Transept", k:"transeptSections", l:"Transept sections (per arm)", t:"num", min:1, step:1, int:true},
  {g:"Transept", k:"transeptDir", l:"Transept seat direction", t:"sel",
    opts:[["forward","Forward (face altar end)"],["toward","Toward crossing"],["angled","Angled at altar"]]},

  {g:"Per-seat", k:"seatWidth", l:"Seat width", t:"num", min:0.1, step:0.1},
  {g:"Per-seat", k:"seatDepth", l:"Seat depth", t:"num", min:0.1, step:0.1},
  {g:"Per-seat", k:"legSpace", l:"Leg space (front)", t:"num", min:0, step:0.1},

  {g:"Aisles", k:"centerAisle", l:"Center aisle (even #)", t:"num", min:0, step:0.5},
  {g:"Aisles", k:"nonCenterAisle", l:"Between-section aisle", t:"num", min:0, step:0.5},
  {g:"Aisles", k:"edgeAisle", l:"Edge aisle (by walls)", t:"num", min:0, step:0.5},

  {g:"Altar", k:"altarDistance", l:"Altar dist. from crossing center", t:"range", min:0, max:60, step:0.5},
  {g:"Altar", k:"altarWidth", l:"Altar width", t:"num", min:0, step:0.5},
  {g:"Altar", k:"altarDepth", l:"Altar depth", t:"num", min:0, step:0.5},
  {g:"Altar", k:"frontToAltar", l:"Front nave row → altar", t:"num", min:0, step:0.5},
];
const GROUP_ORDER = ["Nave","Transept","Per-seat","Aisles","Altar"];

/* ---------- state ---------- */
const state = { tabs: [], active: 0 };

/* ---------- geometry helpers ---------- */
// Divide a span of total length L into n equal seat-sections separated by aisles.
// Returns {segs:[{start,size}], size, aisleSum}. Center aisle only used when n is even.
function layoutSections(L, n, centerA, nonCenterA, edgeA){
  n = Math.max(1, Math.round(n));
  let inter = 0;
  if (n > 1){
    if (n % 2 === 0) inter = centerA + nonCenterA * (n - 2);
    else inter = nonCenterA * (n - 1);
  }
  const usable = L - 2*edgeA - inter;
  const size = usable > 0 ? usable / n : 0;
  const segs = [];
  let pos = edgeA;
  for (let i=0;i<n;i++){
    segs.push({start:pos, size:size});
    pos += size;
    if (i < n-1){
      const isCenterGap = (n % 2 === 0) && (i === n/2 - 1);
      pos += isCenterGap ? centerA : nonCenterA;
    }
  }
  return {segs, size, inter};
}

function rot(pt, piv, a){
  const c=Math.cos(a), s=Math.sin(a);
  const dx=pt.x-piv.x, dy=pt.y-piv.y;
  return {x:piv.x + dx*c - dy*s, y:piv.y + dx*s + dy*c};
}

// Build a bar from anchor a, along the seat-axis (unit ax) for length span,
// and depth-axis (unit dx) for depth. seats = seats in this bar.
function makeBar(ax0, ay0, axx, axy, dxx, dxy, seats){
  const a={x:ax0, y:ay0};
  const b={x:ax0+axx, y:ay0+axy};
  const c={x:ax0+axx+dxx, y:ay0+axy+dxy};
  const d={x:ax0+dxx, y:ay0+dxy};
  return {a,b,c,d,seats};
}

/* ---------- core model ---------- */
function buildModel(cfg){
  const nw=+cfg.naveWidth, nl=+cfg.naveLength;
  const tw=+cfg.transeptWidth, tl=+cfg.transeptLength;
  const sW=+cfg.seatWidth, sD=+cfg.seatDepth, leg=+cfg.legSpace;
  const pitch = sD + leg;
  const cA=+cfg.centerAisle, ncA=+cfg.nonCenterAisle, eA=+cfg.edgeAisle;
  const nSec=Math.max(1,Math.round(cfg.naveSections));
  const tSec=Math.max(1,Math.round(cfg.transeptSections));
  const dir = cfg.transeptDir;

  const cx=0, cy=0;
  const halfNW=nw/2, halfTW=tw/2;

  // altar
  const d=+cfg.altarDistance;
  const altar={cx:cx, cy:cy-d, w:+cfg.altarWidth, h:+cfg.altarDepth};
  const altarFrontY = altar.cy + altar.h/2;   // edge facing the nave (downward)
  const altarTopY   = altar.cy - altar.h/2;
  // chancel auto-extends behind the altar
  const behind = Math.max(+cfg.altarDepth, 6);
  const chancelTopY = Math.min(cy - halfTW, altarTopY - behind);

  // overall extents
  const xL = cx - halfNW - tl, xR = cx + halfNW + tl;
  const naveBottom = cy + halfTW + nl;
  const bounds = {minX:xL, maxX:xR, minY:chancelTopY, maxY:naveBottom};

  // cross outline (clockwise)
  const outline = [
    {x:cx-halfNW, y:chancelTopY}, {x:cx+halfNW, y:chancelTopY},
    {x:cx+halfNW, y:cy-halfTW},   {x:xR,        y:cy-halfTW},
    {x:xR,        y:cy+halfTW},   {x:cx+halfNW, y:cy+halfTW},
    {x:cx+halfNW, y:naveBottom},  {x:cx-halfNW, y:naveBottom},
    {x:cx-halfNW, y:cy+halfTW},   {x:xL,        y:cy+halfTW},
    {x:xL,        y:cy-halfTW},   {x:cx-halfNW, y:cy-halfTW},
  ];

  const bars = [];

  /* ----- NAVE (faces up toward altar): seat-axis +x, depth +y ----- */
  const naveLeft = cx - halfNW;
  const frontRowTopY = Math.max(cy + halfTW, altarFrontY + (+cfg.frontToAltar));
  const naveRows = Math.max(0, Math.floor((naveBottom - frontRowTopY) / pitch + 1e-9));
  const naveLay = layoutSections(nw, nSec, cA, ncA, eA);
  const naveSeatsPerSec = Math.floor(naveLay.size / sW + 1e-9);
  const naveSeatsPerRow = naveSeatsPerSec * nSec;
  for (let r=0;r<naveRows;r++){
    const y0 = frontRowTopY + r*pitch;
    for (const seg of naveLay.segs){
      if (naveSeatsPerSec<=0) continue;
      bars.push(makeBar(naveLeft+seg.start, y0, seg.size,0, 0,sD, naveSeatsPerSec));
    }
  }

  /* ----- TRANSEPTS ----- */
  let tRows=0, tSeatsPerSec=0, tSeatsPerRow=0;
  const armBars=[];
  if (dir === "forward"){
    // faces up: seat-axis +x along arm length, depth +y across transept width
    tRows = Math.max(0, Math.floor(tw / pitch + 1e-9));
    const lay = layoutSections(tl, tSec, cA, ncA, eA);
    tSeatsPerSec = Math.floor(lay.size / sW + 1e-9);
    tSeatsPerRow = tSeatsPerSec * tSec;
    const arms=[{base:xL}, {base:cx+halfNW}]; // left arm starts at xL, right arm at inner edge
    for (const arm of arms){
      for (let r=0;r<tRows;r++){
        const y0 = (cy-halfTW) + r*pitch;
        for (const seg of lay.segs){
          if (tSeatsPerSec<=0) continue;
          armBars.push(makeBar(arm.base+seg.start, y0, seg.size,0, 0,sD, tSeatsPerSec));
        }
      }
    }
  } else {
    // toward crossing (and angled = toward + rotation): depth along arm length, seat-axis +y
    tRows = Math.max(0, Math.floor(tl / pitch + 1e-9));
    const lay = layoutSections(tw, tSec, cA, ncA, eA);
    tSeatsPerSec = Math.floor(lay.size / sW + 1e-9);
    tSeatsPerRow = tSeatsPerSec * tSec;

    // LEFT arm: faces +x (toward crossing). front row at inner edge (x=cx-halfNW), rows go outward (-x)
    const leftBars=[];
    for (let r=0;r<tRows;r++){
      const xRight = (cx-halfNW) - r*pitch;
      const xLeft = xRight - sD;
      for (const seg of lay.segs){
        if (tSeatsPerSec<=0) continue;
        leftBars.push(makeBar(xLeft, (cy-halfTW)+seg.start, 0,seg.size, sD,0, tSeatsPerSec));
      }
    }
    // RIGHT arm: faces -x. front at inner edge (x=cx+halfNW), rows go outward (+x)
    const rightBars=[];
    for (let r=0;r<tRows;r++){
      const xLeft = (cx+halfNW) + r*pitch;
      for (const seg of lay.segs){
        if (tSeatsPerSec<=0) continue;
        rightBars.push(makeBar(xLeft, (cy-halfTW)+seg.start, 0,seg.size, sD,0, tSeatsPerSec));
      }
    }
    if (dir === "angled"){
      const pivL={x:cx-halfNW, y:cy};
      const angL=Math.atan2(altar.cy-pivL.y, altar.cx-pivL.x); // toward-layout faces +x (angle 0)
      const pivR={x:cx+halfNW, y:cy};
      const angR=Math.atan2(altar.cy-pivR.y, altar.cx-pivR.x) - Math.PI; // toward-layout faces -x (angle π)
      for (const bar of leftBars){ bar.a=rot(bar.a,pivL,angL); bar.b=rot(bar.b,pivL,angL); bar.c=rot(bar.c,pivL,angL); bar.d=rot(bar.d,pivL,angL); }
      for (const bar of rightBars){ bar.a=rot(bar.a,pivR,angR); bar.b=rot(bar.b,pivR,angR); bar.c=rot(bar.c,pivR,angR); bar.d=rot(bar.d,pivR,angR); }
    }
    armBars.push(...leftBars, ...rightBars);
  }
  bars.push(...armBars);

  const naveTotal = naveSeatsPerRow * naveRows;
  const armTotal = tSeatsPerRow * tRows;
  const transeptTotal = armTotal * 2;
  const total = naveTotal + transeptTotal;

  const stats = {
    total,
    naveRows, naveSeatsPerRow, naveTotal, naveSec:nSec,
    tRows, tSeatsPerRow, armTotal, transeptTotal, tSec,
    totalRows: naveRows + 2*tRows,
    footW: xR - xL, footH: naveBottom - chancelTopY,
  };

  return {outline, altar, bars, bounds, stats};
}

/* ---------- rendering ---------- */
const CV = document.getElementById("cv");
const DPR = window.devicePixelRatio || 1;
const CW = 900, CH = 680, PAD = 28;
function setupCanvas(){
  CV.width = CW*DPR; CV.height = CH*DPR;
  CV.style.width = CW+"px"; CV.style.height = CH+"px";
}
setupCanvas();

function render(cfg){
  const m = buildModel(cfg);
  const ctx = CV.getContext("2d");
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,CW,CH);

  const fw = Math.max(1, m.bounds.maxX-m.bounds.minX);
  const fh = Math.max(1, m.bounds.maxY-m.bounds.minY);
  const s = Math.min((CW-2*PAD)/fw, (CH-2*PAD)/fh);
  const ox = (CW - fw*s)/2, oy = (CH - fh*s)/2;
  const X = x => ox + (x-m.bounds.minX)*s;
  const Y = y => oy + (y-m.bounds.minY)*s;

  const poly = (pts) => { ctx.beginPath(); pts.forEach((p,i)=> i? ctx.lineTo(X(p.x),Y(p.y)) : ctx.moveTo(X(p.x),Y(p.y))); ctx.closePath(); };

  // walls: white fill + black outline
  poly(m.outline);
  ctx.fillStyle="#fff"; ctx.fill();
  ctx.save();
  // clip to interior so seats never spill across walls
  poly(m.outline); ctx.clip();

  // seat rows
  ctx.lineWidth = 1;
  for (const bar of m.bars){
    ctx.beginPath();
    ctx.moveTo(X(bar.a.x),Y(bar.a.y));
    ctx.lineTo(X(bar.b.x),Y(bar.b.y));
    ctx.lineTo(X(bar.c.x),Y(bar.c.y));
    ctx.lineTo(X(bar.d.x),Y(bar.d.y));
    ctx.closePath();
    ctx.fillStyle = getCss("--tan");
    ctx.fill();
    ctx.strokeStyle = getCss("--tanstroke");
    ctx.stroke();
    // seat divisions along a->b
    if (bar.seats>1 && s*dist(bar.a,bar.b)/bar.seats > 3){
      ctx.beginPath();
      for (let i=1;i<bar.seats;i++){
        const t=i/bar.seats;
        const p={x:bar.a.x+(bar.b.x-bar.a.x)*t, y:bar.a.y+(bar.b.y-bar.a.y)*t};
        const q={x:p.x+(bar.d.x-bar.a.x), y:p.y+(bar.d.y-bar.a.y)};
        ctx.moveTo(X(p.x),Y(p.y)); ctx.lineTo(X(q.x),Y(q.y));
      }
      ctx.strokeStyle="rgba(160,125,79,.55)"; ctx.stroke();
    }
  }
  ctx.restore();

  // altar (drawn over seats)
  const a=m.altar;
  ctx.fillStyle=getCss("--accent");
  ctx.fillRect(X(a.cx-a.w/2), Y(a.cy-a.h/2), a.w*s, a.h*s);

  // re-stroke walls crisply on top
  poly(m.outline);
  ctx.lineWidth=2.5; ctx.strokeStyle="#000"; ctx.stroke();

  // labels
  ctx.fillStyle="#000"; ctx.font="600 14px system-ui,Segoe UI,Arial";
  ctx.fillText(cfg.name, 12, 22);
  ctx.font="12px system-ui,Segoe UI,Arial"; ctx.fillStyle="#555";
  ctx.fillText(`${m.stats.total} seats · ${Math.round(m.stats.footW)}′ × ${Math.round(m.stats.footH)}′`, 12, 40);
  // altar tag
  ctx.fillStyle=getCss("--accent"); ctx.font="600 11px system-ui,Arial"; ctx.textAlign="center";
  ctx.fillText("ALTAR", X(a.cx), Y(a.cy-a.h/2)-4);
  ctx.textAlign="left";

  return m.stats;
}
function dist(p,q){return Math.hypot(p.x-q.x,p.y-q.y);}
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

/* ---------- stats panel + comparison table ---------- */
function renderStats(stats){
  const el=document.getElementById("stats");
  const cell=(v,k,big)=>`<div class="stat ${big?'big':''}"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  el.innerHTML =
    cell(stats.total, "Total seats", true) +
    cell(stats.naveTotal, `Nave total (${stats.naveSeatsPerRow}/row × ${stats.naveRows} rows)`) +
    cell(stats.transeptTotal, `Transepts total (both arms)`) +
    cell(stats.naveSeatsPerRow, `Seats per nave row · ${stats.naveSec} section${stats.naveSec>1?'s':''}`) +
    cell(stats.tSeatsPerRow, `Seats per transept row · ${stats.tSec} section${stats.tSec>1?'s':''}`) +
    cell(stats.tRows, `Transept rows (per arm)`) +
    cell(stats.armTotal, `Seats per transept arm`) +
    cell(stats.totalRows, `Total rows (nave + both arms)`);
}

function renderCompare(){
  const t=document.getElementById("cmp");
  const rows=[
    ["Total seats", s=>s.total],
    ["Nave seats/row", s=>s.naveSeatsPerRow],
    ["Nave rows", s=>s.naveRows],
    ["Nave total", s=>s.naveTotal],
    ["Transept seats/row", s=>s.tSeatsPerRow],
    ["Transept rows/arm", s=>s.tRows],
    ["Transept total", s=>s.transeptTotal],
    ["Footprint (ft)", s=>`${Math.round(s.footW)}×${Math.round(s.footH)}`],
  ];
  const stats=state.tabs.map(c=>buildModel(c).stats);
  let html="<thead><tr><th>Metric</th>"+state.tabs.map(c=>`<th>${escapeHtml(c.name)}</th>`).join("")+"</tr></thead><tbody>";
  for(const [label,fn] of rows){
    html+="<tr><td>"+label+"</td>"+stats.map(s=>`<td>${fn(s)}</td>`).join("")+"</tr>";
  }
  html+="</tbody>";
  t.innerHTML = state.tabs.length>1 ? html : "";
  t.style.display = state.tabs.length>1 ? "table" : "none";
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

/* ---------- inputs ---------- */
function buildControls(){
  const cfg = state.tabs[state.active];
  const wrap = document.getElementById("controls");
  wrap.innerHTML="";

  // name field
  const nameFs=document.createElement("fieldset");
  nameFs.innerHTML=`<legend>Tab</legend>
    <div class="field full"><input type="text" id="f_name" value="${escapeHtml(cfg.name)}" /></div>`;
  wrap.appendChild(nameFs);
  nameFs.querySelector("#f_name").addEventListener("input", e=>{ cfg.name=e.target.value; buildTabs(); refresh(); });

  for (const g of GROUP_ORDER){
    const fs=document.createElement("fieldset");
    const lg=document.createElement("legend"); lg.textContent=g; fs.appendChild(lg);
    for (const f of FIELDS.filter(x=>x.g===g)){
      fs.appendChild(buildField(cfg,f));
    }
    wrap.appendChild(fs);
  }
}

function buildField(cfg,f){
  const row=document.createElement("div");
  const label=`<label for="f_${f.k}">${f.l}</label>`;
  if (f.t==="sel"){
    row.className="field";
    row.innerHTML=label+`<select id="f_${f.k}">`+f.opts.map(o=>`<option value="${o[0]}" ${cfg[f.k]===o[0]?"selected":""}>${o[1]}</option>`).join("")+`</select>`;
    row.querySelector("select").addEventListener("change",e=>{cfg[f.k]=e.target.value; refresh();});
  } else if (f.t==="range"){
    row.className="field range";
    row.innerHTML=label+`<input type="number" id="f_${f.k}" value="${cfg[f.k]}" step="${f.step}" min="${f.min}" />`;
    const slider=document.createElement("input");
    slider.type="range"; slider.min=f.min; slider.max=f.max; slider.step=f.step; slider.value=cfg[f.k];
    slider.style.gridColumn="1 / -1";
    const num=row.querySelector("input[type=number]");
    slider.addEventListener("input",e=>{cfg[f.k]=+e.target.value; num.value=e.target.value; refresh();});
    num.addEventListener("input",e=>{cfg[f.k]=+e.target.value; slider.value=e.target.value; refresh();});
    row.appendChild(slider);
  } else {
    row.className="field";
    row.innerHTML=label+`<input type="number" id="f_${f.k}" value="${cfg[f.k]}" step="${f.step}" ${f.min!=null?`min="${f.min}"`:""} />`;
    row.querySelector("input").addEventListener("input",e=>{
      let v=+e.target.value; if(f.int) v=Math.round(v); cfg[f.k]=v; refresh();
    });
  }
  return row;
}

/* ---------- tabs ---------- */
function buildTabs(){
  const bar=document.getElementById("tabsbar");
  bar.innerHTML="";
  state.tabs.forEach((c,i)=>{
    const tab=document.createElement("div");
    tab.className="tab"+(i===state.active?" active":"");
    tab.innerHTML=`<span>${escapeHtml(c.name)}</span>`;
    tab.querySelector("span").addEventListener("click",()=>{state.active=i; buildTabs(); buildControls(); refresh();});
    tab.querySelector("span").addEventListener("dblclick",()=>{
      const n=prompt("Rename tab:",c.name); if(n!=null){c.name=n; buildTabs(); buildControls(); refresh();}
    });
    if(state.tabs.length>1){
      const x=document.createElement("button"); x.className="x"; x.textContent="×"; x.title="Close tab";
      x.addEventListener("click",ev=>{ev.stopPropagation(); state.tabs.splice(i,1); if(state.active>=state.tabs.length) state.active=state.tabs.length-1; buildTabs(); buildControls(); refresh();});
      tab.appendChild(x);
    }
    bar.appendChild(tab);
  });
  const add=document.createElement("button"); add.className="btn"; add.textContent="+ Add";
  add.addEventListener("click",()=>{ state.tabs.push(defaultConfig(nextName())); state.active=state.tabs.length-1; buildTabs(); buildControls(); refresh(); });
  const dup=document.createElement("button"); dup.className="btn"; dup.textContent="⧉ Duplicate";
  dup.addEventListener("click",()=>{ const c=JSON.parse(JSON.stringify(state.tabs[state.active])); c.name=nextName(); state.tabs.push(c); state.active=state.tabs.length-1; buildTabs(); buildControls(); refresh(); });
  const tools=document.createElement("div"); tools.className="toolbar"; tools.appendChild(add); tools.appendChild(dup);
  bar.appendChild(tools);
}
function nextName(){
  const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(const ch of letters){ const n="Option "+ch; if(!state.tabs.some(t=>t.name===n)) return n; }
  return "Option "+(state.tabs.length+1);
}

/* ---------- refresh ---------- */
function refresh(){
  const stats = render(state.tabs[state.active]);
  renderStats(stats);
  renderCompare();
}

/* ---------- serialization ---------- */
function encodeCfg(cfg){
  const json=JSON.stringify(cfg);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodeCfg(str){
  let s=str.trim().replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4) s+="=";
  return JSON.parse(decodeURIComponent(escape(atob(s))));
}
function mergeDefaults(c){ return Object.assign(defaultConfig(c.name||"Option A"), c); }

document.getElementById("exportBtn").addEventListener("click",()=>{
  const cfg=state.tabs[state.active];
  render(cfg);
  CV.toBlob(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download=(cfg.name||"church-layout").replace(/[^\w\-]+/g,"_")+".png";
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
});
document.getElementById("strBtn").addEventListener("click",async()=>{
  const str=encodeCfg(state.tabs[state.active]);
  await copy(str, "Config string copied — paste it via “Load from string”.");
});
document.getElementById("linkBtn").addEventListener("click",async()=>{
  const str=encodeCfg(state.tabs[state.active]);
  const base=location.href.replace(/[?#].*$/,"");  // works for file:// and http(s)
  const url=base+"?c="+str;
  await copy(url, "Share link copied — opening it auto-loads this layout.");
});
document.getElementById("loadBtn").addEventListener("click",()=>{
  const inp=prompt("Paste a config string or share link:");
  if(!inp) return;
  try{
    let s=inp.trim();
    const m=s.match(/[?&]c=([^&]+)/); if(m) s=m[1];
    const cfg=mergeDefaults(decodeCfg(s));
    if(!cfg.name || state.tabs.some(t=>t.name===cfg.name)) cfg.name=nextName();
    state.tabs.push(cfg); state.active=state.tabs.length-1;
    buildTabs(); buildControls(); refresh();
  }catch(e){ alert("Could not read that config string.\n"+e.message); }
});
async function copy(text,msg){
  try{ await navigator.clipboard.writeText(text); toast(msg); }
  catch(e){ prompt("Copy this:",text); }
}
function toast(msg){
  const t=document.createElement("div");
  t.textContent=msg;
  t.style.cssText="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)";
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}

/* ---------- init ---------- */
(function init(){
  const params=new URLSearchParams(location.search);
  const c=params.get("c");
  if(c){
    try{ const cfg=mergeDefaults(decodeCfg(c)); state.tabs=[cfg]; }
    catch(e){ state.tabs=[defaultConfig("Option A"), defaultConfig("Option B")]; }
  } else {
    state.tabs=[defaultConfig("Option A"), defaultConfig("Option B")];
  }
  state.active=0;
  buildTabs(); buildControls(); refresh();
})();
</script>
